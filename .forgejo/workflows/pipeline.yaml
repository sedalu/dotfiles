# `name:` is what the required-status context is built from:
# `pipeline / check (pull_request)`.
name: "pipeline"

"on":
  pull_request:
  push:
    branches: ["main"]

# A superseded check run is wasted work.
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: "docker"
    container:
      # The shared image carries mise and what a job needs before mise can run.
      # Every other tool arrives pinned, from the lockfile.
      image: "forge.taildfeaeb.ts.net/boldlygo/runner:0.1.1"
    steps:
      - uses: "actions/checkout@v7"

      - name: "Trust the workspace"
        # actions/checkout marks the workspace safe under a temporary HOME
        # that it then discards,
        # so libgit2 meets a repository it considers foreign-owned and refuses to open.
        run: |
          git config --global --add safe.directory "$PWD"

      - name: "Run checks"
        env:
          # Forgejo injects its own GITHUB_TOKEN,
          # which the GitHub API rejects outright;
          # mise reads it when resolving release assets.
          MISE_GITHUB_TOKEN: "${{ secrets.GH_PAT }}"
        run: "mise run check:all"
