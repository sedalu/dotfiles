name: "check"

"on":
  pull_request:
  push:
    branches: ["main"]

# A superseded check run is wasted work.
concurrency:
  group: "check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: "docker"
    container:
      # Debian rather than Alpine: the pipeline's tools ship glibc binaries.
      image: "debian:stable-slim"
    steps:
      - name: "Install dependencies"
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: "actions/checkout@v4"

      # The only provisioning step: every tool arrives pinned, from the lockfile.
      - name: "Install mise"
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://mise.run | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "Trust the workspace"
        # actions/checkout marks the workspace safe under a temporary HOME
        # that it then discards,
        # so libgit2 meets a repository it considers foreign-owned and refuses to open.
        run: |
          git config --global --add safe.directory "$PWD"

      - name: "Run checks"
        env:
          # Forgejo injects its own GITHUB_TOKEN,
          # which the GitHub API rejects outright;
          # mise reads it when resolving release assets.
          MISE_GITHUB_TOKEN: "${{ secrets.GH_PAT }}"
        run: "mise run check:all"
