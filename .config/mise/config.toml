[settings]
lockfile = true

[env]
# Runs the git hooks under `mise x`,
# so they resolve this config's tools even in a shell that has not activated mise.
HK_MISE = "1"

# Wrappers that supply a config flag their tool has no other way to receive.
# `_.path` puts them ahead of the tool install dirs;
# PROJECT_ROOT is how they name the config.
_.path = [".config/mise/bin"]
PROJECT_ROOT = "{{config_root}}"

# shellcheck takes extra flags from here; its own search never looks in `.config/`.
SHELLCHECK_OPTS = "--rcfile={{config_root}}/.config/shellcheckrc"

# The toolchain the hk pipeline runs on.
[tools]
"aqua:owenlamont/ryl" = "0.21"
gitleaks = "8.30"
hk = "1.57"
jq = "1.8"
rumdl = "0.2"
shellcheck = "0.11"
shfmt = "3.14"
tombi = "1.5"
typos = "1.50"
yamlfmt = "0.21"
