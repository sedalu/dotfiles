# typos spell-checker config.
# typos names its config only by flag,
# so `.config/mise/bin/typos` supplies it on every invocation.
# Seed the allow-list as false positives surface from `hk check --all`.

[default.extend-words]
# Words typos misreads, e.g.:
# "caladan" = "caladan"
# Asimov "Foundation" worldbuilding name in docs/TODO.md (not "Zone"/"Xeon").
"Zeon" = "Zeon"

[default.extend-identifiers]
# Exact identifiers to leave alone, e.g.:
# "WROTE" = "WROTE"

[files]
# Path-level excludes are handled by hk's per-step `exclude` (see hk.pkl);
# add patterns here only for typos-specific skips.
