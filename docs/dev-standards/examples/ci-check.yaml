# Reference workflow for ci.md.
# The whole point is the single run step: CI enters through the same task a hook does.
"on":
  pull_request:
  push:
    branches: ["main"]
concurrency:
  group: "check-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  check:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      # The only provisioning step. Every tool arrives pinned, from the lockfile.
      # A language-specific setup action would install a version nobody pinned.
      - uses: "jdx/mise-action@v3"
      - run: "mise run check:all"
