min_version = "2026.7.15"

[settings]
auto_install = true
disable_backends = ["asdf", "pipx", "ubi"]
env_shell_expand = true
experimental = true
quiet = true
verbose = false

[settings.npm]
package_manager = "bun"

# Machine-global system packages (shared libs and bootstrap tools),
# poured by mise's built-in Homebrew bottle installer — no `brew` required.
# Install with `mise bootstrap packages install`; see `install:mise:system-packages`.
# Per-OS packages (incl. the mas CLI) live in config.macos.toml;
# per-machine packages in config.<machine>.toml (both auto-loaded — see miserc.toml).
[bootstrap.packages]
"brew:bash" = "latest"
"brew:git" = "latest"
"brew:zsh" = "latest"
"brew:openssl@3" = "latest" # required by Python (ssl module) and networking Rust crates
"brew:pkgconf" = "latest"   # helps compilers locate openssl and other libs when building from source

# Declarative symlinks for repo-sourced config files,
# applied by `mise dotfiles apply` (wired into `install:symlinks`).
# Per-machine entries live in config.<machine>.toml;
# all [dotfiles] tables union across loaded files (see miserc.toml).
# The install task backs up any conflicting non-symlink target to .bak first,
# since `apply --force` overwrites without a backup of its own.
[dotfiles."~/.claude"]
source = "~/.config/claude"
mode = "symlink"

[dotfiles."~/.bash_profile"]
source = "~/.config/shell/bash/.bash_profile"
mode = "symlink"

[dotfiles."~/.bashrc"]
source = "~/.config/shell/bash/.bashrc"
mode = "symlink"

[dotfiles."~/.zshenv"]
source = "~/.config/shell/zsh/.zshenv"
mode = "symlink"

[dotfiles."~/.ssh/config"]
source = "~/.config/ssh/config"
mode = "symlink"

# Go environment file (GOPATH/GOMODCACHE/GOCACHE), rendered from go/env.tmpl.
# Declarative replacement for the old `go env -w` install task:
# `go` reads this file natively in every context (interactive or not, mise or not),
# which a mise [env] block — scoped to mise-activated shells only — would miss.
# template mode (not symlink) so a stray `go env -w` can't write back into the repo.
[dotfiles."~/.config/go/env"]
source = "~/.config/go/env.tmpl"
mode = "template"

# Scalar macOS `defaults write` preferences,
# applied by `mise bootstrap macos-defaults apply` (wired into `install:macos`).
# Per-machine entries live in config.<machine>.toml and union via MISE_ENV (see miserc.toml).
# Only scalar writes belong here;
# the `defaults delete` reset-catalog and killall restart logic stay in macos/settings.sh,
# since mise can express neither an absent key nor an app restart.
[bootstrap.macos.defaults."com.apple.dock"]
# Dock position.
# https://macos-defaults.com/dock/orientation.html
orientation = "bottom"
# Icon size of Dock items, in pixels.
# https://macos-defaults.com/dock/tilesize.html
tilesize = 36
# Autohide the Dock (toggle with ⌥⌘d).
# https://macos-defaults.com/dock/autohide.html
autohide = true
# Dock open/close animation time (0 = instant).
# https://macos-defaults.com/dock/autohide-time-modifier.html
autohide-time-modifier = 0.0
# Dock open delay (0 = none).
# https://macos-defaults.com/dock/autohide-delay.html
autohide-delay = 0.0

[bootstrap.macos.defaults."com.apple.finder"]
# View style: clmv=column, icnv=icon, Nlsv=list, Flwv=gallery.
# https://macos-defaults.com/finder/fxpreferredviewstyle.html
FXPreferredViewStyle = "clmv"
# https://macos-defaults.com/desktop/showexternalharddrivesondesktop.html
ShowExternalHardDrivesOnDesktop = true
# https://macos-defaults.com/desktop/showharddrivesondesktop.html
ShowHardDrivesOnDesktop = false
# https://macos-defaults.com/desktop/showremovablemediaondesktop.html
ShowRemovableMediaOnDesktop = true

[bootstrap.macos.defaults.NSGlobalDomain]
# Disable the window minimize-on-double-click gesture.
AppleMiniaturizeOnDoubleClick = false
# Add a period when you type a double-space.
# https://macos-defaults.com/keyboard/applekeyboardaddperiodwithdoublespace.html
NSAutomaticPeriodSubstitutionEnabled = true
# Spring-loading delay for folders, in seconds.
"com.apple.springing.delay" = 0.5
# Use F1–F12 as standard function keys.
# https://macos-defaults.com/keyboard/applekeyboardfnstate.html
"com.apple.keyboard.fnState" = true

[shell_alias]
# eza -> ls
ls = "eza --all --icons=always --group-directories-first --git"
ll = "eza --all --icons=always --group-directories-first --git --long"
lt = "eza --all --icons=always --group-directories-first --git --tree --level=1"
llt = "eza --all --icons=always --group-directories-first --git --long --tree --level=1"

# bat -> cat
# cat = "bat"

