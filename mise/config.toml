# hk linters (see hk.pkl); typos/yamlfmt ship no shell completions, so they stay bare.
# gitleaks, rumdl, and ryl get completion postinstall hooks below.
typos = "latest"
yamlfmt = "latest"

# presenterm ships no shell completions either (clap without clap_complete), so it stays bare too.
"aqua:mfontanini/presenterm" = "latest"

# Sub-table tools (with postinstall hooks or extra options)

[tools."aqua:tamasfe/taplo"]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions completions {}"

# ryl — the YAML linter (replaces yamlfmt's -lint role; see hk.pkl).
[tools."aqua:owenlamont/ryl"]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions --generate-completions {}"

[tools."go:github.com/go-delve/delve/cmd/dlv"]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions completion {}"

[tools.bat]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions --completion {}"

[tools.fd]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions --gen-completions {}"

[tools.fnox]
version = "latest"
postinstall = """
$DOTFILES_DIR/mise/hooks/completions completion {}
rm -f ${XDG_CACHE_HOME:-$HOME/.cache}/zsh/init/fnox.zsh ${XDG_CACHE_HOME:-$HOME/.cache}/bash/init/fnox.bash
"""

[tools.fzf]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions --{}"

[tools.gitleaks]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions completion {}"

[tools.golangci-lint]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions completion {}"

[tools.helix]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/helix-postinstall {}"

# [tools.ollama]
# version = "latest"
# postinstall = "$DOTFILES_DIR/mise/hooks/ollama-postinstall"

[tools.ripgrep]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions --tool rg --generate complete-{}"

[tools.rumdl]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions completions {}"

[tools.starship]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions completions {}"

[tools.xh]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions --generate complete-{}"

[tools.yq]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/completions completion {}"

[env]
FNOX_AGE_KEY_FILE = "~/.config/fnox/age.txt"

