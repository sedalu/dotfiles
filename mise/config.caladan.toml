# Per-machine packages for caladan, auto-loaded via MISE_ENV (see miserc.toml).
# Add non-GUI per-machine packages here as "brew:<formula>" / "apt:<pkg>" / etc.
[bootstrap.packages]

# Per-machine GUI apps for caladan.
# GUI .app bundles can't ride brew-cask: (mise mangles app bundles, failing Gatekeeper),
# so they install from the vendor DMG via the http:/github: backend + the install-app hook
# (mount the DMG, copy the notarized .app to ~/Applications) — the ghostty/cmux pattern.
[tools."github:obsidianmd/obsidian-releases"]
version = "latest"
asset_pattern = "*.dmg" # the release ships a single universal .dmg
postinstall = "$DOTFILES_DIR/mise/hooks/install-app"

[tools."http:steam"]
version = "1.0.0" # rolling installer; Steam.app self-updates on launch
platforms.macos-arm64.url = "https://cdn.fastly.steamstatic.com/client/installer/steam.dmg"
postinstall = "$DOTFILES_DIR/mise/hooks/install-app"

# Per-machine symlinks for caladan,
# unioned with the base [dotfiles] in config.toml
# and applied by `dotfiles:install:symlinks`.
# The ~/Downloads redirect targets a non-repo source (iCloud Drive);
# the install task's ACL-aware backup-preflight clears the deny-delete ACL
# on a fresh ~/Downloads before `apply` replaces it with the symlink.
[dotfiles."~/.claude/projects/-Users-seth--config/memory"]
source = "~/.config/.claude/memory"
mode = "symlink"

[dotfiles."~/Downloads"]
source = "~/Library/Mobile Documents/com~apple~CloudDocs/Downloads"
mode = "symlink"

# Per-machine scalar macOS preferences for caladan,
# unioned with the base [bootstrap.macos.defaults] in config.toml via MISE_ENV.
# Settings with no `defaults write` equivalent (Tips, Mail, Spotlight categories)
# are documented in macos/manual.md.
[bootstrap.macos.defaults."io.tailscale.ipn.macsys"]
# Hide the Tailscale menu-bar app's Dock icon.
HideDockIcon = true

[bootstrap.macos.defaults.NSGlobalDomain]
# Use 24-hour time system-wide.
AppleICUForce24HourTime = true
# Always show scrollbars (overrides the default "Automatic").
AppleShowScrollBars = "Always"
# Finder sidebar icon size (1=small, 2=medium, 3=large).
NSTableViewDefaultSizeMode = 1

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
# Show the date in the menu-bar clock.
ShowDate = true
# Hide the day of week.
ShowDayOfWeek = false
# Digital clock (not analog).
IsAnalog = false
# Flash the colon separator each second.
FlashDateSeparators = true
# Do not show seconds.
ShowSeconds = false

[bootstrap.macos.defaults."com.apple.Passwords"]
# Show Passwords in the menu bar.
EnableMenuBarExtra = true

[bootstrap.macos.defaults."com.apple.Safari.SandboxBroker"]
# Enable the Develop menu in Safari.
ShowDevelopMenu = true

[bootstrap.macos.defaults."com.apple.assistant.support"]
# Disable "Help Apple Improve Search" (2 = opted out).
"Search Queries Data Sharing Status" = 2
