# macOS-only tools, loaded automatically via auto_env (see miserc.toml).
[tools]
mas = "latest"  # Mac App Store CLI; drives the "mas:" entries below

# cmux terminal — ships a notarized .app in a DMG,
# moved to ~/Applications by the install-app hook.
[tools."github:manaflow-ai/cmux"]
version = "latest"
postinstall = "$DOTFILES_DIR/mise/hooks/install-app"
platforms.macos-arm64.asset_pattern = "cmux-macos.dmg"

# macOS-only system packages, loaded automatically via auto_env (see miserc.toml).
# mise pours Homebrew formulae directly into /opt/homebrew — no `brew` needed.
[bootstrap.packages]
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:tailscale-app" = "latest"
"brew-cask:ungoogled-chromium" = "latest"
"mas:682658836" = "latest"  # GarageBand
"mas:408981434" = "latest"  # iMovie
"mas:361285480" = "latest"  # Keynote
"mas:361309726" = "latest"  # Pages
"mas:361304891" = "latest"  # Numbers

# Login shell for this account, converged by `mise bootstrap user apply`
# (wired into install:login-shell; checked by doctor:login-shell).
# Homebrew zsh rather than the system /bin/zsh — the newer build installed via [bootstrap.packages].
# `apply` registers it in /etc/shells (one-time sudo) then chsh's this account.
# macOS-only: the path is Homebrew-arm-specific.
[bootstrap.user]
login_shell = "/opt/homebrew/bin/zsh"
