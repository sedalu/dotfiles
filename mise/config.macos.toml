# macOS-only system packages, loaded automatically via auto_env (see miserc.toml).
# mise pours Homebrew formulae directly into /opt/homebrew — no `brew` needed.
#
# GUI casks stay in homebrew/Brewfile — mise 2026.6.6 cask support is not yet
# usable for our apps:
#   - tailscale-app: pkg-type artifact — unsupported (hard error).
#   - obsidian: binary-type artifact — unsupported (hard error).
#   - claude / steam: app-type casks install, but mise mangles nested Electron
#     frameworks so the bundle fails Gatekeeper ("App is damaged"). brew's
#     install of the same version is notarization-valid. (Verified 2026-06-13.)
# Revisit when mise cask support matures.
[bootstrap.packages]
"brew:mas" = "latest" # Mac App Store CLI (formula); apps installed by the mas tasks

# Login shell for this account, converged by `mise bootstrap user apply`
# (wired into dotfiles:install:login-shell; checked by doctor:login-shell).
# Homebrew zsh rather than the system /bin/zsh — the newer build installed via
# [bootstrap.packages]. `apply` registers it in /etc/shells (one-time sudo) then
# chsh's this account. macOS-only: the path is Homebrew-arm-specific.
[bootstrap.user]
login_shell = "/opt/homebrew/bin/zsh"
