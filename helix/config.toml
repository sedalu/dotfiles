theme = "catppuccin_mocha"

[editor]
bufferline = "multiple"

[editor.soft-wrap]
enable = true

[editor.cursor-shape]
# Bar (pipe) caret in insert mode so the exact insertion point is visible;
# normal and select keep the block caret (Helix default).
insert = "bar"

[keys.normal]
# Lazygit
C-g = [
  ":write-all",
  ":insert-output lazygit >/dev/tty",
  ":redraw",
  ":reload-all",
]

# Save (overrides default: save selection to register)
C-s = ":write"

# Quit all
C-q = ":quit-all"

# macOS-style navigation.
# Window nav lives on the C-w chord + arrows (a Helix default),
# since macOS Mission Control owns Ctrl+Arrow and intercepts it before the terminal.
# Word jump rides Ghostty's Option+Arrow translation (alt+arrow_left=esc:b / _right=esc:f),
# so it reaches Helix as A-b / A-f.
# Line start/end can't use Command — Cmd is bound to tabs/scroll in Ghostty,
# and Helix has no super modifier — so it uses Control directly: the emacs-style C-a / C-e.
# Word motions collapse the selection after moving (move_word_impl always selects),
# so a plain motion only moves the caret.
# collapse_selection lands on the range cursor (head-1 forward, head backward — no
# collapse-to-head command exists), so A-f nudges right once to reach head.
# This optimizes for code; in whitespace-only prose it can sit one past the word start.
"A-b" = ["move_prev_word_start", "collapse_selection"]
"A-f" = ["move_next_word_start", "collapse_selection", "move_char_right"]
"C-a" = "goto_line_start"
"C-e" = "goto_line_end"

# Shift extends the selection along the same motions.
# Ghostty's shift+arrow / shift+home/end fall through to Helix when no terminal
# selection is active, so these arrive as S-* via the kitty keyboard protocol.
"S-left" = "extend_char_left"
"S-right" = "extend_char_right"
"S-up" = "extend_visual_line_up"
"S-down" = "extend_visual_line_down"
"S-A-left" = "extend_prev_word_start"
"S-A-right" = "extend_next_word_start"
"S-home" = "extend_to_line_start"
"S-end" = "extend_to_line_end"
# S-C-a / S-C-e are the Shift partners of the C-a / C-e line motions
# (same commands as S-home / S-end), pressed as Ctrl+Shift and disambiguated by the kitty protocol.
"S-C-a" = "extend_to_line_start"
"S-C-e" = "extend_to_line_end"

# Delete key removes the selection (Helix leaves backspace/del unbound here).
# The _noyank variant keeps Delete a pure delete, distinct from cut and d's yank-delete.
"del" = "delete_selection_noyank"
"backspace" = "delete_selection_noyank"

# CUA-style clipboard. C-c displaces toggle_comments (still on space-c);
# C-a / C-x displace increment / decrement (relocated to +/- below).
# Cut yanks to the system clipboard, then deletes without touching the yank register.
# paste_clipboard_after lands at the caret on a collapsed cursor, after the selection otherwise.
"C-c" = "yank_to_clipboard"
"C-x" = ["yank_to_clipboard", "delete_selection_noyank"]
"C-v" = "paste_clipboard_after"
# C-/ toggles comments to match VSCode (Cmd-/); additive — toggle_comments is also on space-c.
"C-/" = "toggle_comments"

# Relocate the defaults the macOS bindings displaced.
# Parent-node start moves to A-a, pairing with the default A-e (move_parent_node_end)
# the way C-a / C-e bracket the line — Ctrl spans the line, Alt spans the syntax node.
# A-a was select_all_siblings, relocated to S-A-a;
# the rest of the tree-sitter family (expand/shrink, siblings, [ / ] gotos, mi/ma) is intact.
"+" = "increment"
"-" = "decrement"
"A-a" = "move_parent_node_start"
"S-A-a" = "select_all_siblings"

[keys.normal.space]
# Buffer operations
x = ":buffer-close"
X = ":buffer-close-others"

# Window splits
v = ":vsplit"
s = ":hsplit"

# Override the goto menu's `e` to jump to the very end of the file (goto_file_end),
# mirroring gg's jump to the very start; the default ge is goto_last_line (start of last line).
# Bare G is a no-op (goto_line acts only with a count), so reach start-of-last-line via ge then C-a.
[keys.normal.g]
e = "goto_file_end"

# macOS-style navigation, select mode.
# A plain motion moves the caret here too (collapsing any selection),
# matching macOS where an unshifted motion drops the selection;
# the Shift bindings extend it instead.
[keys.select]
"A-b" = ["move_prev_word_start", "collapse_selection"]
"A-f" = ["move_next_word_start", "collapse_selection", "move_char_right"]
"C-a" = "goto_line_start"
"C-e" = "goto_line_end"
"S-left" = "extend_char_left"
"S-right" = "extend_char_right"
"S-up" = "extend_visual_line_up"
"S-down" = "extend_visual_line_down"
"S-A-left" = "extend_prev_word_start"
"S-A-right" = "extend_next_word_start"
"S-home" = "extend_to_line_start"
"S-end" = "extend_to_line_end"
# Shift partners of the C-a / C-e line motions (see normal mode).
"S-C-a" = "extend_to_line_start"
"S-C-e" = "extend_to_line_end"
# delete_selection exits select mode afterward, returning to normal.
"del" = "delete_selection_noyank"
"backspace" = "delete_selection_noyank"
"C-c" = "yank_to_clipboard"
"C-x" = ["yank_to_clipboard", "delete_selection_noyank"]
"C-v" = "paste_clipboard_after"
"C-/" = "toggle_comments"
# Relocated displaced defaults (extend variant of parent-node nav in select mode).
# A-a mirrors normal; select's A-e is already extend_parent_node_end by default.
# A-a was select_all_siblings, relocated to S-A-a.
"+" = "increment"
"-" = "decrement"
"A-a" = "extend_parent_node_start"
"S-A-a" = "select_all_siblings"

# ge extends the selection to the very end of the file (mirrors normal mode).
[keys.select.g]
e = "extend_to_file_end"

# macOS-style navigation, insert mode.
# Word motions always select in Helix (move_word_impl), which makes no sense mid-insert,
# so collapse the selection back to a bare caret after moving.
# collapse_selection lands on the range cursor, one grapheme behind head on a forward
# motion, so A-f nudges right once to sit on the next word's start (A-b already lands right).
# goto_line_end_newline (not goto_line_end) so the cursor can sit past the last char,
# matching Helix's own insert-mode End binding.
[keys.insert]
"A-b" = ["move_prev_word_start", "collapse_selection"]
"A-f" = ["move_next_word_start", "collapse_selection", "move_char_right"]
"C-a" = "goto_line_start"
"C-e" = "goto_line_end_newline"
"S-left" = "extend_char_left"
"S-right" = "extend_char_right"
"S-up" = "extend_visual_line_up"
"S-down" = "extend_visual_line_down"
"S-A-left" = "extend_prev_word_start"
"S-A-right" = "extend_next_word_start"
"S-home" = "extend_to_line_start"
"S-end" = "extend_to_line_end"
# Shift partners of the C-a / C-e line motions (see normal mode).
"S-C-a" = "extend_to_line_start"
"S-C-e" = "extend_to_line_end"
# C-x cut displaces Helix's insert-mode completion trigger (relocated to C-Space below).
"C-c" = "yank_to_clipboard"
"C-x" = ["yank_to_clipboard", "delete_selection_noyank"]
"C-v" = "paste_clipboard_after"
"C-/" = "toggle_comments"
# Restore the completion trigger on a conventional key.
"C-space" = "completion"
